name: Gerar APK Android Directo

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java / Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Capacitor Globalmente
        run: |
          npm install -g @capacitor/cli

      - name: Criar Estrutura Android
        run: |
          mkdir -p www
          cp -r * www/ 2>/dev/null || true
          npx cap init "BookWorm" "com.bookworm.app" --web-dir "www"
          npm install @capacitor/core @capacitor/android
          npx cap add android
          npx cap sync android

      - name: Compilar APK Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar Ficheiro APK
        uses: actions/upload-artifact@v4
        with:
          name: BookWorm-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
